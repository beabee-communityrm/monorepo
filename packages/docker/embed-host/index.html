<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrowdNewsroom embed test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 48rem;
        margin: 0 auto;
        padding: 1rem;
      }
      form {
        display: grid;
        gap: 1rem;
        justify-items: start;
      }
      label[for="url"],
      legend {
        font-weight: 600;
      }
      #url {
        display: block;
        width: min(24rem, 100%);
        padding: 0.375rem 0.5rem;
        font: inherit;
      }
      fieldset {
        border: none;
        margin: 0;
        padding: 0;
      }
      fieldset label {
        display: block;
      }
      button {
        padding: 0.375rem 1rem;
        font: inherit;
      }
      #embed:not(:empty) {
        margin-top: 2rem;
        border: 2px dashed #888;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CrowdNewsroom embed test</h1>
      <p>
        Embeds a page the way an external site would. The Vite option loads
        embed.js from the frontend build. Run
        <code>yarn workspace @beabee/frontend build:embed</code> first, and
        again after changing <code>embed.ts</code>.
      </p>
      <form>
        <div>
          <label for="url">Path to embed</label>
          <input id="url" name="url" placeholder="crowdnewsroom/my-slug" />
        </div>
        <fieldset>
          <legend>Embed from</legend>
          <label>
            <input type="radio" name="from" value="app" checked />
            Docker stack (__appUrl__)
          </label>
          <label>
            <input type="radio" name="from" value="dev" />
            Vite (__devUrl__)
          </label>
        </fieldset>
        <button>Embed</button>
      </form>
      <div id="embed"></div>
    </main>
    <script>
      // Cross-site from the app on localhost
      if (location.hostname === "localhost") location.hostname = "127.0.0.1";

      const params = new URLSearchParams(location.search);
      const url = params.get("url");
      const fromDev = params.get("from") === "dev";
      if (url) {
        document.getElementById("url").value = url;
        document.querySelector(
          `input[name="from"][value="${fromDev ? "dev" : "app"}"]`,
        ).checked = true;
        const script = document.createElement("script");
        script.src = fromDev ? "/dev/embed.js" : "__appUrl__/embed.js";
        script.dataset.url = url;
        document.getElementById("embed").append(script);
      }
    </script>
  </body>
</html>
