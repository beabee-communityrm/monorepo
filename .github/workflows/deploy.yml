name: Deploy

on:
  push:
    branches:
      - main
      - dev
    tags:
      - v*

jobs:
  check:
    uses: ./.github/workflows/check.yml

  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          stripe_public_key: ${{ secrets.BEABEE_STRIPE_PUBLICKEY }}
          stripe_secret_key: ${{ secrets.BEABEE_STRIPE_SECRETKEY }}
      - run: yarn test
        working-directory: ./apps/backend

  init:
    runs-on: ubuntu-24.04

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=main-${{ github.run_number }}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }},priority=100
            type=raw,value=dev-${{ github.run_number }}-{{sha}},enable=${{ github.ref == 'refs/heads/dev' }},priority=100

  build-push-backend:
    runs-on: ubuntu-24.04
    needs: [check, test, init]

    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push legacy app
        uses: docker/build-push-action@v5
        with:
          file: ./packages/docker/base.dockerfile
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          labels: ${{ needs.init.outputs.labels }}
          target: legacy_app
          tags: ${{ secrets.DOCKER_ORGANISATION }}/beabee-legacy-app:sha-${{ github.sha }}

      - name: Build and push API app
        uses: docker/build-push-action@v5
        with:
          file: ./packages/docker/base.dockerfile
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          labels: ${{ needs.init.outputs.labels }}
          target: api_app
          tags: ${{ secrets.DOCKER_ORGANISATION }}/beabee-api-app:sha-${{ github.sha }}

      - name: Build and push webhook app
        uses: docker/build-push-action@v5
        with:
          file: ./packages/docker/base.dockerfile
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          labels: ${{ needs.init.outputs.labels }}
          target: webhook_app
          tags: ${{ secrets.DOCKER_ORGANISATION }}/beabee-webhook-app:sha-${{ github.sha }}

      - name: Build and push cron app
        uses: docker/build-push-action@v5
        with:
          file: ./packages/docker/base.dockerfile
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          labels: ${{ needs.init.outputs.labels }}
          target: cron_app
          tags: ${{ secrets.DOCKER_ORGANISATION }}/beabee-cron-app:sha-${{ github.sha }}

  build-push-frontend:
    runs-on: ubuntu-24.04
    needs: [check, test, init]

    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend app
        uses: docker/build-push-action@v5
        with:
          file: ./apps/frontend/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.init.outputs.version }}
            REVISION=${{ github.sha }}
          labels: ${{ needs.init.outputs.labels }}
          tags: ${{ secrets.DOCKER_ORGANISATION }}/beabee-frontend:sha-${{ github.sha }}

  build-push-router:
    runs-on: ubuntu-24.04
    needs: [check, test, init]

    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push router app
        uses: docker/build-push-action@v5
        with:
          file: ./apps/router/Dockerfile
          push: true
          build-args: |
            REVISION=${{ github.sha }}
          labels: ${{ needs.init.outputs.labels }}
          tags: ${{ secrets.DOCKER_ORGANISATION }}/beabee-router:sha-${{ github.sha }}

  # Public tags are only added once every image is built: the cluster rolls
  # out as soon as a new tag appears on beabee-api-app and expects the same
  # tag to exist on all the other images.
  publish-tags:
    runs-on: ubuntu-24.04
    needs:
      [
        init,
        build-push-backend,
        build-push-frontend,
        build-push-router,
      ]

    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag images
        env:
          ORG: ${{ secrets.DOCKER_ORGANISATION }}
          TAGS: ${{ needs.init.outputs.tags }}
        run: |
          # beabee-api-app goes last as it is the image the cluster watches
          for image in beabee-legacy-app beabee-webhook-app beabee-cron-app beabee-frontend beabee-router beabee-api-app; do
            args=()
            for tag in $TAGS; do
              args+=(-t "$ORG/$image:$tag")
            done
            docker buildx imagetools create "${args[@]}" "$ORG/$image:sha-$GITHUB_SHA"
          done

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    needs: [init, publish-tags]

    steps:
      - uses: actions/checkout@v4
        with:
          repository: beabee-communityrm/hive-deploy-stack
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ref: main

      - run: |
          git config --global user.name "Deploy bot"
          git config --global user.email "<>"

          echo -n ${{ needs.init.outputs.version }} > VERSION
          ./update.sh

          git add VERSION docker-compose.yml
          if ! git diff --quiet --cached; then
            git commit -m "Deploy version ${{ needs.init.outputs.version }}"
            git push
          fi
