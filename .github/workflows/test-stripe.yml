name: Stripe tests

on:
  merge_group:
  workflow_dispatch:

jobs:
  run-stripe-tests:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: beabee-stripe-tests-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          stripe_public_key: ${{ secrets.BEABEE_STRIPE_PUBLICKEY }}
          stripe_secret_key: ${{ secrets.BEABEE_STRIPE_SECRETKEY }}

      - uses: ./.github/actions/test-setup
        with:
          stripe_membership_product_id: ${{ secrets.BEABEE_STRIPE_MEMBERSHIPPRODUCTID }}

      - name: Run Stripe tests
        run: yarn workspace @beabee/e2e-api-tests test:stripe

      - name: Teardown
        if: failure()
        uses: ./.github/actions/test-teardown
        with:
          db_name: "stripe-test-dump"
