name: 'Setup'
description: 'Setup the repository'

inputs:
  stripe_public_key:
    description: 'Stripe public key'
    required: true
  stripe_secret_key:
    description: 'Stripe secret key'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        cache: yarn
        node-version: 26.13.0
    - name: Install dependencies
      run: yarn install
      shell: bash
    - name: Build
      run: yarn build:check
      shell: bash
    - name: bootstrap
      run: yarn bootstrap
      shell: bash
    - name: Update env variables
      shell: bash
      run: |
        sed -i "s|BEABEE_STRIPE_PUBLICKEY=|BEABEE_STRIPE_PUBLICKEY=${{ inputs.stripe_public_key }}|" .env
        sed -i "s|BEABEE_STRIPE_SECRETKEY=|BEABEE_STRIPE_SECRETKEY=${{ inputs.stripe_secret_key }}|" .env
