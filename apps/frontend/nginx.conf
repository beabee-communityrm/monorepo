# This image ships both frontend builds. DEFAULT_FRONTEND (old|new) picks the
# one served by default; the beabee_frontend cookie, set via ?frontend=new|old
# by app_router, overrides it per user.
map $cookie_beabee_frontend $frontend_root {
  default  /usr/share/nginx/html/${DEFAULT_FRONTEND};
  "new"    /usr/share/nginx/html/new;
  "old"    /usr/share/nginx/html/old;
}

server {
  listen       80;
  listen  [::]:80;
  server_name  _;

  root $frontend_root;
  index index.html;

  location / {
    expires -1;
    add_header Cache-Control 'no-cache, no-store';
    try_files $uri $uri/ /index.html;
  }

  location /embed.js {
    expires 60s;
  }

  # Stylesheet for the IdP's login pages, requested from the login domain
  # without the frontend cookie, so it always comes from the new build
  location = /login-theme.css {
    root /usr/share/nginx/html/new;
    expires 5m;
  }

  location /assets {
    expires 1y;
    log_not_found off;
  }
}
