# This image ships both frontend builds. Default = the stable frontend
# (apps/frontend-old); the beabee_frontend cookie, set via ?frontend=new by
# app_router, opts a user into the new one (apps/frontend).
map $cookie_beabee_frontend $frontend_root {
  default  /usr/share/nginx/html/stable;
  "new"    /usr/share/nginx/html/new;
}

server {
  listen       80;
  listen  [::]:80;
  server_name  _;

  root $frontend_root;
  index index.html;

  location / {
    expires -1;
    add_header Cache-Control 'no-cache, no-store';
    try_files $uri $uri/ /index.html;
  }

  location /embed.js {
    expires 60s;
  }

  location /assets {
    expires 1y;
  }
}
